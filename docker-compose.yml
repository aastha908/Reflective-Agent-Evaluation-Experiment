services:
  research-platform:
    build: .
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      DATABASE_URL: file:/app/data/research.db
      API_PORT: "4000"
      API_HOST: "0.0.0.0"
      WEB_ORIGIN: http://127.0.0.1:4000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
    volumes:
      - research-data:/app/data
volumes:
  research-data:
